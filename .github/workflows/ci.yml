name: Portfolio checks
on:
  push:
    branches: [main, master, dev, "codex/**"]
  pull_request:
    branches: [main, master]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Lint, types, API tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: .next
          include-hidden-files: true
          retention-days: 1
  browser:
    name: Desktop & mobile browser tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 7
  gate:
    name: Quality gate
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$CHECKS" = success && test "$BROWSER" = success
